<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concierge - Cercle Privé</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --midnight: #0a1128;
            --gold: #d4af37;
            --gold-dim: #8a7425;
            --white: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background: var(--midnight);
            color: var(--white);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.03) 0%, transparent 50%);
            pointer-events: none;
        }

        header {
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--gold-dim);
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gold);
            text-decoration: none;
        }

        .balance {
            font-size: 1.3rem;
            color: var(--gold);
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 2rem;
            position: relative;
            z-index: 1;
        }

        .game-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            text-align: center;
            color: var(--gold);
            margin-bottom: 1rem;
        }

        .subtitle {
            text-align: center;
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }

        .chat-container {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.7), rgba(10, 17, 40, 0.9));
            border: 3px solid var(--gold);
            border-radius: 10px;
            height: 600px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        .message {
            margin-bottom: 1.5rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            text-align: right;
        }

        .message-content {
            display: inline-block;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            max-width: 70%;
        }

        .message.bot .message-content {
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--gold-dim);
        }

        .message.user .message-content {
            background: rgba(212, 175, 55, 0.4);
            border: 1px solid var(--gold);
        }

        .message-sender {
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
            opacity: 0.7;
        }

        .chat-input-area {
            padding: 1.5rem;
            border-top: 1px solid var(--gold-dim);
            display: flex;
            gap: 1rem;
        }

        .chat-input {
            flex: 1;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--gold-dim);
            color: var(--white);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            border-radius: 5px;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--gold);
        }

        .send-btn {
            padding: 1rem 2rem;
            border: 2px solid var(--gold);
            background: var(--gold);
            color: var(--midnight);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            border-radius: 5px;
        }

        .send-btn:hover {
            background: transparent;
            color: var(--gold);
        }

        .quick-questions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .quick-btn {
            padding: 1rem;
            border: 2px solid var(--gold-dim);
            background: rgba(0, 0, 0, 0.4);
            color: var(--white);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 5px;
        }

        .quick-btn:hover {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.2);
        }

        .typing-indicator {
            display: none;
            padding: 0.5rem 1rem;
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--gold-dim);
            border-radius: 10px;
            width: fit-content;
        }

        .typing-indicator.active {
            display: inline-block;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--gold);
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">← Cercle Privé</a>
            <div class="balance">
                Saldo: <span id="balance">10,000</span> ₵
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="game-title">💬 CONCIERGE 💬</h1>
        <p class="subtitle">Din personliga assistent på Cercle Privé</p>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <div class="message-sender">Concierge</div>
                    <div class="message-content">
                        Välkommen till Cercle Privé! Jag är din personliga concierge. Hur kan jag hjälpa dig idag?
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chatInput" placeholder="Skriv ditt meddelande..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">Skicka</button>
            </div>
        </div>

        <div class="quick-questions">
            <button class="quick-btn" onclick="askQuestion('Vilka spel finns?')">Vilka spel finns?</button>
            <button class="quick-btn" onclick="askQuestion('Hur spelar man blackjack?')">Hur spelar man blackjack?</button>
            <button class="quick-btn" onclick="askQuestion('Vad är mitt saldo?')">Vad är mitt saldo?</button>
            <button class="quick-btn" onclick="askQuestion('Förklara roulette')">Förklara roulette</button>
        </div>
    </div>

    <script>
        let balance = parseInt(localStorage.getItem('balance')) || 10000;
        document.getElementById('balance').textContent = balance.toLocaleString();

        const responses = {
            'vilka spel': 'Vi erbjuder fem fantastiska spel: Slots 🎰, Roulette 🎡, Blackjack 🃏, Poker ♠️ och Craps 🎲. Alla spel är gratis att spela med virtuella pengar!',
            'spel': 'Vi har Slots, Roulette, Blackjack, Poker och Craps. Vilket vill du veta mer om?',
            'blackjack': 'I Blackjack spelar du mot dealern. Målet är att få 21 poäng eller närmare 21 än dealern utan att gå över. Ess räknas som 1 eller 11, klädda kort som 10. Du kan välja "Kort" för fler kort eller "Stanna" för att sluta.',
            'roulette': 'Roulette är ett klassiskt casinospel där du satsar på var bollen landar. Du kan satsa på röd/svart, jämn/udda, specifika nummer eller grupper. Europeisk roulette har 37 nummer (0-36).',
            'poker': 'Vi erbjuder Video Poker (Jacks or Better). Du får 5 kort, väljer vilka du vill behålla, och drar nya kort. Målet är att få bästa möjliga pokerhand. Par med knekt eller högre ger vinst!',
            'slots': 'Slots är enkelt! Välj din insats, tryck på "Snurra" och hoppas på att symbolerna matchar. Tre lika symboler ger vinst. Diamanter ger högst utbetalning (50x), följt av stjärnor (25x).',
            'craps': 'Craps är ett tärningsspel. Pass Line-bet vinner på 7 eller 11 på första kastet. Field-bet vinner på 2,3,4,9,10,11,12. Det är ett snabbt och spännande spel!',
            'saldo': `Ditt nuvarande saldo är ${balance.toLocaleString()} ₵. Du kan köpa fler chips via Banken i huvudmenyn.`,
            'regler': 'Vilket spel vill du veta reglerna för? Vi har Slots, Roulette, Blackjack, Poker och Craps.',
            'hjälp': 'Jag kan hjälpa dig med spelregler, förklara hur olika spel fungerar, visa ditt saldo och svara på frågor om Cercle Privé. Vad vill du veta?',
            'hej': 'Hej och välkommen! Hur kan jag hjälpa dig idag?',
            'tack': 'Varsågod! Är det något mer du undrar över?',
            'default': 'Förlåt, jag förstod inte riktigt. Kan du formulera om frågan? Jag kan hjälpa dig med spelregler, saldo och allmän information om våra spel.'
        };

        function addMessage(content, isUser = false) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            messageDiv.innerHTML = `
                <div class="message-sender">${isUser ? 'Du' : 'Concierge'}</div>
                <div class="message-content">${content}</div>
            `;
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTyping() {
            const messagesDiv = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typing-indicator-msg';
            typingDiv.innerHTML = `
                <div class="typing-indicator active">
                    <span></span><span></span><span></span>
                </div>
            `;
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typing-indicator-msg');
            if (typing) typing.remove();
        }

        function getResponse(message) {
            const msg = message.toLowerCase();
            
            for (let key in responses) {
                if (msg.includes(key)) {
                    return responses[key];
                }
            }
            
            return responses['default'];
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage(message, true);
            input.value = '';
            
            showTyping();
            
            setTimeout(() => {
                hideTyping();
                const response = getResponse(message);
                addMessage(response);
            }, 1000 + Math.random() * 1000);
        }

        function askQuestion(question) {
            document.getElementById('chatInput').value = question;
            sendMessage();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
